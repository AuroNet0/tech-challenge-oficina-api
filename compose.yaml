services:

  db:
    image: postgres:15-alpine
    container_name: oficina_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: oficina_db
      POSTGRES_USER: oficina_user
      POSTGRES_PASSWORD: oficina_pass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_user -d oficina_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: oficina_app
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/oficina_db
      SPRING_DATASOURCE_USERNAME: oficina_user
      SPRING_DATASOURCE_PASSWORD: oficina_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: minha-chave-secreta

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: