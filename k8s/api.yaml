apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      containers:
        - name: oficina-api
          image: api-oficina:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: SPRING_JPA_HIBERNATE_DDL_AUTO
            - name: SPRING_DOCKER_COMPOSE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: SPRING_DOCKER_COMPOSE_ENABLED
            - name: APP_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: APP_PUBLIC_BASE_URL
            - name: APP_MAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: APP_MAIL_FROM
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: SPRING_MAIL_USERNAME
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: JWT_SECRET
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: SPRING_MAIL_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-api
spec:
  selector:
    app: oficina-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
