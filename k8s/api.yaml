apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      containers:
        - name: oficina-api
          image: 446517826146.dkr.ecr.us-east-1.amazonaws.com/tech-challenge-oficina-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: SPRING_JPA_HIBERNATE_DDL_AUTO
            - name: SPRING_DOCKER_COMPOSE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: SPRING_DOCKER_COMPOSE_ENABLED
            - name: APP_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: APP_PUBLIC_BASE_URL
            - name: NEW_RELIC_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: NEW_RELIC_ENABLED
            - name: NEW_RELIC_APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: NEW_RELIC_APP_NAME
            - name: APP_MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: APP_MAIL_FROM
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: SPRING_MAIL_USERNAME
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: JWT_SECRET
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: SPRING_MAIL_PASSWORD
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: NEW_RELIC_LICENSE_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-api
spec:
  selector:
    app: oficina-api
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer
