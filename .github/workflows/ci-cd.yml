name: API CI/CD

on:
  push:
    branches:
      - homolog
      - master
  pull_request:
    branches:
      - homolog
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tech-challenge-oficina-api
  EKS_CLUSTER: tech-challenge-oficina
  RDS_INSTANCE_IDENTIFIER: tech-challenge-oficina-postgres
  K8S_DEPLOYMENT: oficina-api
  K8S_CONTAINER: oficina-api
  K8S_CONFIGMAP: oficina-config
  K8S_SECRET: oficina-secrets

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run automated tests
        run: ./mvnw -B test

      - name: Build application package
        run: ./mvnw -B clean package -DskipTests

      - name: Build Docker image
        run: docker build --target runtime -t ${{ env.ECR_REPOSITORY }}:ci-${{ github.sha }} .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/homolog' || github.ref == 'refs/heads/master')
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'homolog' }}
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/master' && 'production' || 'homolog' }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      DEPLOY_TAG: ${{ github.ref == 'refs/heads/master' && 'production' || 'homolog' }}
      JWT_SECRET: ci-jwt-secret
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run automated tests
        run: ./mvnw -B test

      - name: Build application package
        run: ./mvnw -B clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build --target runtime \
            -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_TAG }} \
            .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image for ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker tag ${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_TAG }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_TAG }}

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_TAG }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Get RDS endpoint
        id: rds
        run: |
          endpoint="$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.RDS_INSTANCE_IDENTIFIER }} \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)"
          echo "jdbc_url=jdbc:postgresql://${endpoint}:5432/oficina" >> "$GITHUB_OUTPUT"

      - name: Apply Kubernetes ConfigMap
        env:
          SPRING_DATASOURCE_URL: ${{ steps.rds.outputs.jdbc_url }}
          APP_PUBLIC_BASE_URL: ${{ vars.APP_PUBLIC_BASE_URL }}
          NEW_RELIC_ENABLED: ${{ vars.NEW_RELIC_ENABLED }}
          NEW_RELIC_APP_NAME: ${{ vars.NEW_RELIC_APP_NAME }}
        run: |
          kubectl create configmap ${{ env.K8S_CONFIGMAP }} \
            --from-literal=SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
            --from-literal=SPRING_DATASOURCE_USERNAME="oficina_admin" \
            --from-literal=SPRING_JPA_HIBERNATE_DDL_AUTO="update" \
            --from-literal=SPRING_DOCKER_COMPOSE_ENABLED="false" \
            --from-literal=APP_PUBLIC_BASE_URL="$APP_PUBLIC_BASE_URL" \
            --from-literal=NEW_RELIC_ENABLED="$NEW_RELIC_ENABLED" \
            --from-literal=NEW_RELIC_APP_NAME="$NEW_RELIC_APP_NAME" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          K8S_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          APP_MAIL_FROM: ${{ secrets.APP_MAIL_FROM }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          kubectl create secret generic ${{ env.K8S_SECRET }} \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=JWT_SECRET="$K8S_JWT_SECRET" \
            --from-literal=SPRING_MAIL_USERNAME="$SPRING_MAIL_USERNAME" \
            --from-literal=SPRING_MAIL_PASSWORD="$SPRING_MAIL_PASSWORD" \
            --from-literal=APP_MAIL_FROM="$APP_MAIL_FROM" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kubectl set image --local -f k8s/api.yaml \
            ${{ env.K8S_CONTAINER }}=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -o yaml | kubectl apply -f -
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} --timeout=180s
