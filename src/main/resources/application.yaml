spring:
  application:
    name: oficina-mecanica

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina_db}
    username: ${SPRING_DATASOURCE_USERNAME:oficina_user}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: always


jwt:
  secret: ${JWT_SECRET:minha-chave-secreta}
  expiration: 86400000


springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
